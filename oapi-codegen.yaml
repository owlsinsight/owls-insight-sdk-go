# Models-only generation from spec/openapi.json. Run `go generate ./...`.
package: owls
generate:
  models: true
output: models_gen.go
output-options:
  # Keep every component, including those no path references after the overlay.
  skip-prune: true
  # Go initialisms: EventID, not EventId. Changing this after a release renames
  # every such field, so it is fixed before 0.1.0.
  name-normalizer: ToCamelCaseWithInitialisms
  # Request inputs are hand-written (params.go, stream.go, webhooks.go): they need
  # value fields, not the all-optional pointers the lenient response schemas produce.
  exclude-schemas:
    - SubscribeOptions
    - PropsSubscribeOptions
    - SgpBuildParams
    - SgpLeg
    - CreateWebhookParams
    - UpdateWebhookParams
    - RotateWebhookSecretParams
    - WebhookFiltersInput
    - WebhookLineMovedFiltersInput
    - WebhookEvFoundFiltersInput
  # nil already means "absent" for a slice or map, so containers are not pointers.
  # Scalars stay pointers: a 0 spread must be told apart from a missing one.
  prefer-skip-optional-pointer-on-container-types: true
  type-mapping:
    number:
      default:
        type: float64
      formats:
        double:
          type: float64
  overlay:
    path: spec/go-overlay.yaml
  user-templates:
    # The stock header also declares a package comment; doc.go owns that.
    imports.tmpl: |
      // Code generated by {{.ModuleName}} version {{.Version}} DO NOT EDIT.

      package {{.PackageName}}

      import (
      	"encoding/json"
      	"fmt"
      	{{- range .ExternalImports}}
      	{{ . }}
      	{{- end}}
      	{{- range .AdditionalImports}}
      	{{.Alias}} "{{.Package}}"
      	{{- end}}
      )
